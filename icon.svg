<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
  </defs>
  <!-- Squircle Aurora sólido -->
  <rect width="512" height="512" rx="112" fill="url(#aurora)"/>
  <!-- Barras blancas: top sólida + 3 con opacidad descendente -->
  <g transform="translate(64 64) scale(6)">
    <rect x="14" y="6"  width="36" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="8"  y="20" width="48" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="11" y="34" width="42" height="10" rx="5" fill="#FFFFFF" opacity="0.65"/>
    <rect x="17" y="48" width="30" height="10" rx="5" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>
